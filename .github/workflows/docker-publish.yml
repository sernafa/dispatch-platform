name: Docker Publish

# Builds the multi-arch container image (linux/amd64 + linux/arm64) and publishes it to
# GHCR as ghcr.io/${{ github.repository }} (ghcr.io/sernafa/dispatch-platform).
#
# Triggers:
#   - push to main           -> tags: latest, main, sha-<commit>
#   - push a tag v*.*.*      -> tags: full semver, major.minor, latest (for stable tags)
#   - manual workflow_dispatch
#
# NOTE: GHCR packages are private by default. To make the image publicly downloadable, do a
# ONE-TIME change on GitHub: repo page -> Packages -> dispatch-platform -> Package settings ->
# Danger Zone -> Change visibility -> Public. All future pushed versions inherit that visibility.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # On tag push (v1.2.3): "1.2.3" + "1.2"
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Branch name (main); `latest` only for stable (non-prerelease) semver tags
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Short commit SHA, e.g. sha-1a2b3c4
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Dispatch SMTP Relay
            org.opencontainers.image.description=Self-hosted SMTP relay / capture platform with dashboard and ingestion API

      - name: Build + push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published to GHCR"
            echo '```'
            for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
              echo "docker pull $tag"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
